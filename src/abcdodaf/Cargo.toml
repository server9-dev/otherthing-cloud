[package]
name = "abcdodaf"
version = "0.1.0"
edition = "2021"
description = "BPMN-based process modeling with DoDAF 2.02 framework for AI workforce orchestration"
license = "MIT"
repository = "https://github.com/server9-dev/otherthing-cloud"

[dependencies]
# BPMN schema types (without the full engine that has compatibility issues)
# We implement our own lightweight execution engine
# bpxe = "0.2"  # Disabled due to rhai 0.19 compilation issues
# bpxe-bpmn-schema = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# UUID generation for process instances
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time for operational activities
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Async streams
futures = "0.3"
async-trait = "0.1"

# HTTP client for Ollama integration
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }

# Regex for template parsing
regex = "1"

# Async stream utilities
async-stream = "0.3"

# CLI dependencies
clap = { version = "4", features = ["derive", "cargo"] }
colored = "2"

# UI dependencies (optional, feature-gated)
egui = { version = "0.33", optional = true }
eframe = { version = "0.33", optional = true, default-features = false, features = ["glow", "wayland", "x11"] }
egui-snarl = { version = "0.9", optional = true, features = ["serde"] }
rfd = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }

[features]
default = []
ui = ["dep:egui", "dep:eframe", "dep:egui-snarl", "dep:rfd", "dep:tracing-subscriber"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lib]
name = "abcdodaf"
path = "src/lib.rs"

[[bin]]
name = "abcdodaf-ui"
path = "src/bin/abcdodaf-ui.rs"
required-features = ["ui"]

[[example]]
name = "simple_workflow"
path = "examples/simple_workflow.rs"

[[example]]
name = "agent_orchestration"
path = "examples/agent_orchestration.rs"

[[example]]
name = "bpm_plus_triple_threat"
path = "examples/bpm_plus_triple_threat.rs"

[[example]]
name = "ui_editor"
path = "examples/ui_editor.rs"
required-features = ["ui"]

[[example]]
name = "enhanced_ui_editor"
path = "examples/enhanced_ui_editor.rs"
required-features = ["ui"]

[[example]]
name = "analytics_dashboard"
path = "examples/analytics_dashboard.rs"

[[example]]
name = "testing_framework_example"
path = "examples/testing_framework_example.rs"

[[example]]
name = "ai_ollama_integration"
path = "examples/ai_ollama_integration.rs"

[[example]]
name = "integration_example"
path = "examples/integration_example.rs"

[[example]]
name = "execution_debugger_demo"
path = "examples/execution_debugger_demo.rs"
required-features = ["ui"]

[[example]]
name = "bpmn_json_converter_example"
path = "examples/bpmn_json_converter_example.rs"
required-features = ["ui"]

[[example]]
name = "bpmn_diagram_converter_example"
path = "examples/bpmn_diagram_converter_example.rs"
required-features = ["ui"]
